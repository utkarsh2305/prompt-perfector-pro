<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#brandGradient)"/>
  
  <!-- Zero circle -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Retry arrow -->
  <path d="M16 9 A6 6 0 1 1 10 16" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="10,12 10,18 14,15" fill="white"/>
  
  <!-- Strike-through -->
  <line x1="7" y1="25" x2="25" y2="7" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
