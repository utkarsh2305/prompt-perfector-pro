<svg width="640" height="180" viewBox="0 0 640 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer purple circle -->
  <circle cx="90" cy="90" r="70" fill="none" stroke="#6B3FD9" stroke-width="16"/>
  
  <!-- Inner arc (right side half circle) -->
  <path d="M 90 45 A 45 45 0 0 1 90 135" fill="none" stroke="#6B3FD9" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Play/Forward arrow -->
  <path d="M 70 70 L 70 110 L 105 90 Z" fill="#6B3FD9"/>
  
  <!-- Diagonal slash through the icon -->
  <line x1="35" y1="145" x2="145" y2="35" stroke="#6B3FD9" stroke-width="16" stroke-linecap="round"/>
  
  <!-- ZeroRetry text -->
  <text x="215" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#000000">ZeroRetry</text>
  
  <!-- Index text in purple -->
  <text x="215" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#6B3FD9">Index</text>
</svg>
