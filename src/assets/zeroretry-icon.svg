<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle (optional, for icon use) -->
  <circle cx="24" cy="24" r="22" fill="white"/>
  
  <!-- Zero circle -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="url(#brandGradient)" stroke-width="3"/>
  
  <!-- Retry arrow (circular) -->
  <path d="M24 12 A10 10 0 1 1 14 24" fill="none" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="14,18 14,26 20,22" fill="url(#brandGradient)"/>
  
  <!-- Strike-through line -->
  <line x1="10" y1="38" x2="38" y2="10" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round"/>
</svg>
